subprojects {
    apply plugin: 'java-library'
    // For the srt-java-live-transmit CLI: produces a real launcher via
    // installDist. Piping `gradlew <task>` is not a substitute - Gradle writes
    // its own progress to stdout, which would corrupt a media stream being
    // relayed through it.
    apply plugin: 'application'

    group = 'org.brewstream'
    version = '0.1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    application {
        mainClass = 'org.brewstream.roast.cli.SrtLiveTransmit'
        applicationName = 'srt-java-live-transmit'
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.assertj:assertj-core:3.27.7'
        testImplementation 'org.mockito:mockito-core:5.23.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    }

    javadoc {
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
        // Keep the checks that catch real mistakes - broken {@link} references,
        // malformed HTML - and drop the missing-tag nag. The packet types are
        // records whose class documentation already describes the wire format
        // field by field; a hundred @param tags restating component names would
        // bury a genuine warning rather than surface one.
    }

    test {
        useJUnitPlatform {
            excludeTags 'interop'
        }
    }

    tasks.register('interopTest', Test) {
        description = 'Runs interop tests against real SRT peers (e.g. srt-live-transmit). ' +
                'Requires a locally built peer binary - see roast/references/srt. Skips itself ' +
                '(does not fail) if the binary is not found.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'interop'
        }
        // Always show what happened - these are slow/environment-dependent, easy to lose track of.
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }

    tasks.register('liveTransmit', JavaExec) {
        description = 'srt-java-live-transmit: relay a live stream between stdin/stdout and an srt:// endpoint.'
        group = 'application'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'org.brewstream.roast.cli.SrtLiveTransmit'
        standardInput = System.in
        if (project.hasProperty('args')) {
            args project.property('args').split(' ')
        }
    }

    tasks.register('relayDemo', JavaExec) {
        description = 'Manual publish/play relay demo (see RelayDemo.java) - not part of the test suite.'
        group = 'application'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'org.brewstream.roast.cli.RelayDemo'
        standardInput = System.in
        if (project.hasProperty('port')) {
            args = [project.property('port')]
        }
    }
}
