name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # `check` covers the unit and integration suites plus the licence-header
      # check. The interop suite is deliberately excluded: it needs a locally
      # built srt-live-transmit and ffmpeg, and skips itself when they are
      # absent, so running it here would report green while testing nothing.
      - name: Build and test
        run: ./gradlew check javadoc

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/build/reports/tests/test
